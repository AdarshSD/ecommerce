<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Forest green background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#1A3A2A"/>

  <!-- Book back layer (slightly offset for depth) -->
  <rect x="9" y="8" width="14" height="17" rx="2" fill="#0D2218"/>

  <!-- Book pages (cream) -->
  <rect x="10" y="7" width="13" height="17" rx="1.5" fill="#F0EBE3"/>

  <!-- Gold spine -->
  <rect x="10" y="7" width="3.5" height="17" rx="1" fill="#C9A84C"/>

  <!-- Page lines -->
  <rect x="15" y="12" width="6" height="1.2" rx="0.6" fill="#1A3A2A" opacity="0.18"/>
  <rect x="15" y="15" width="4.5" height="1.2" rx="0.6" fill="#1A3A2A" opacity="0.18"/>
  <rect x="15" y="18" width="5.5" height="1.2" rx="0.6" fill="#1A3A2A" opacity="0.18"/>

  <!-- Gold leaf emerging from spine top -->
  <path d="M13.5 7 C13.5 4.5, 19 3, 20.5 5.5 C22 8, 16 9.5, 13.5 7Z" fill="#C9A84C"/>
  <!-- Leaf vein -->
  <path d="M13.8 7 C15.5 5.5, 18.5 4.2, 20 5.5" stroke="#FAF7F2" stroke-width="0.5" fill="none" opacity="0.5"/>
</svg>
